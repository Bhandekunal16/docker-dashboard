<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Docker Manager | Dashboard</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      :root {
        --primary: #00b4d8;
        --secondary: #1e293b;
        --background: #0f172a;
        --surface: #1e293b;
        --surface-light: #334155;
        --text-primary: #f8fafc;
        --text-secondary: #cbd5e1;
        --success: #10b981;
        --warning: #f59e0b;
        --danger: #ef4444;
        --border: #475569;
        --radius: 12px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Inter, system-ui, sans-serif;
        background: var(--background);
        color: var(--text-primary);
      }

      header {
        background: var(--surface);
        padding: 20px;
        border-bottom: 1px solid var(--border);
      }

      .container {
        max-width: 1400px;
        margin: auto;
        padding: 0 20px;
      }

      .header-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      h1 {
        color: var(--primary);
      }

      main {
        padding: 30px 0;
      }

      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 14px;
        border-bottom: 1px solid var(--border);
        text-align: center;
      }

      th {
        background: var(--surface-light);
        font-size: 12px;
        text-transform: uppercase;
        color: var(--text-secondary);
      }

      tr:hover {
        background: rgba(255, 255, 255, 0.05);
      }

      .table-container {
        background: var(--surface);
        border-radius: var(--radius);
        overflow: hidden;
        margin-bottom: 40px;
      }

      .container-id {
        font-family: monospace;
        font-size: 12px;
        background: rgba(255, 255, 255, 0.08);
        padding: 4px 6px;
        border-radius: 4px;
      }

      .status-running {
        color: var(--success);
      }

      .status-exited {
        color: var(--danger);
      }

      .btn {
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-primary);
        cursor: pointer;
        margin-right: 6px;
      }

      .btn:hover {
        background: var(--surface-light);
      }

      .btn-success {
        border-color: var(--success);
        color: var(--success);
      }

      .btn-warning {
        border-color: var(--warning);
        color: var(--warning);
      }

      .btn-danger {
        border-color: var(--danger);
        color: var(--danger);
      }

      .logs-box {
        background: #020617;
        color: #94a3b8;
        padding: 16px;
        font-family: monospace;
        max-height: 400px;
        overflow-y: auto;
        border-radius: 0 0 12px 12px;
        white-space: pre-wrap;
      }

      footer {
        text-align: center;
        padding: 20px;
        border-top: 1px solid var(--border);
        color: var(--text-secondary);
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(2, 6, 23, 0.8);
        z-index: 999;
      }

      .modal {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: var(--surface);
        border-radius: 12px;
        padding: 24px;
        width: 380px;
        z-index: 1000;
        border: 1px solid var(--border);
      }

      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>

  <body>
    <header>
      <div class="container header-content">
        <h1><i class="fas fa-ship"></i> Docker Manager</h1>
        <button class="btn" onclick="loadAll()">Reload</button>
      </div>
    </header>

    <main class="container">
      <!-- Containers -->
      <section>
        <div class="section-header">
          <h2><i class="fas fa-box"></i> Containers</h2>
        </div>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Image</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="containerTable"></tbody>
          </table>
        </div>
      </section>

      <!-- Images -->
      <section>
        <div class="section-header">
          <h2><i class="fas fa-layer-group"></i> Images</h2>
          <button
            class="btn btn-danger"
            onclick="confirmAction('Remove selected images?', removeSelectedImages)"
          >
            Remove Selected
          </button>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Created</th>
                <th>Tag</th>
                <th>ID</th>
                <th>Size</th>
                <th>Containers</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="imageTable"></tbody>
          </table>
        </div>
      </section>

      <!-- Logs -->
      <section>
        <div class="section-header">
          <h2><i class="fas fa-terminal"></i> Logs</h2>
          <span id="logTitle">No container selected</span>
        </div>
        <div class="logs-box" id="logsBox">Select a container to view logs</div>
      </section>
    </main>

    <footer>Docker Manager © 2024</footer>

    <!-- Modal -->
    <div id="modalRoot" class="hidden">
      <div class="modal-backdrop"></div>
      <div class="modal">
        <h3 id="modalTitle"></h3>
        <p id="modalMessage"></p>
        <div class="modal-actions">
          <button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn btn-danger" id="modalConfirm">Confirm</button>
        </div>
      </div>
    </div>

    <script>
      const APIS = ["http://0.0.0.0:5000", "http://10.2.1.235:5000"];
      let activeAPI = null;
      let modalAction = null;
      let selectedImageIds = new Set();

      async function fetchWithFallback(path, options = {}, timeout = 4000) {
        for (const baseUrl of APIS) {
          try {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeout);

            const res = await fetch(`${baseUrl}${path}`, {
              ...options,
              signal: controller.signal,
            });

            clearTimeout(timer);
            if (!res.ok) throw new Error();
            activeAPI = baseUrl;
            return await res.json();
          } catch {}
        }
        alert("API unreachable");
      }

      function openModal(title, msg, action) {
        modalAction = action;
        modalTitle.textContent = title;
        modalMessage.textContent = msg;
        modalRoot.classList.remove("hidden");
      }

      function closeModal() {
        modalRoot.classList.add("hidden");
        modalAction = null;
      }

      modalConfirm.onclick = () => {
        modalAction?.();
        closeModal();
      };

      async function loadContainers() {
        const data = await fetchWithFallback("/get/all/containers");
        containerTable.innerHTML = data
          .map(
            (c) => `
          <tr>
            <td><span class="container-id">${c.container_id.slice(0, 12)}</span></td>
            <td>${c.name}</td>
            <td>${c.image}</td>
            <td>${c.status}</td>
            <td>
              <button class="btn btn-danger" onclick="removeContainer('${c.container_id}')">Remove</button>
            </td>
          </tr>
        `
          )
          .join("");
      }

      async function loadImages() {
        const data = await fetchWithFallback("/get/all/images");
        selectedImageIds.clear();

        imageTable.innerHTML = data
          .map(
            (i) => `
          <tr>
            <td>${i.Created_Since}</td>
            <td>${i.Tag || "<none>"}</td>
            <td><span class="container-id">${i.ID.slice(7, 19)}</span></td>
            <td>${i.Size}</td>
            <td>${i.Containers}</td>
            <td>
              <input type="checkbox" onchange="toggleImage('${i.ID}')" />
              <button class="btn btn-danger"
                onclick="confirmAction('Remove image?',()=>removeImage('${i.ID}'))">
                Remove
              </button>
            </td>
          </tr>
        `
          )
          .join("");
      }

      function toggleImage(id) {
        selectedImageIds.has(id)
          ? selectedImageIds.delete(id)
          : selectedImageIds.add(id);
      }

      async function removeImage(imageId) {
        await fetchWithFallback("/remove/image", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ imageId }),
        });
        loadImages();
      }

      async function removeSelectedImages() {
        if (!selectedImageIds.size) return;

        await fetchWithFallback("/remove/images", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ imageIds: [...selectedImageIds] }),
        });
        loadImages();
      }

      async function removeContainer(id) {
        await fetchWithFallback("/remove/container", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ containerId: id }),
        });
        loadContainers();
      }

      function confirmAction(msg, fn) {
        openModal("Confirm", msg, fn);
      }

      function loadAll() {
        loadContainers();
        loadImages();
      }

      document.addEventListener("DOMContentLoaded", loadAll);
    </script>
  </body>
</html>
