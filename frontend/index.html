<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Docker Manager | Dashboard</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      :root {
        --primary: #00b4d8;
        --secondary: #1e293b;
        --background: #0f172a;
        --surface: #1e293b;
        --surface-light: #334155;
        --text-primary: #f8fafc;
        --text-secondary: #cbd5e1;
        --success: #10b981;
        --warning: #f59e0b;
        --danger: #ef4444;
        --border: #475569;
        --radius: 12px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Inter, system-ui, sans-serif;
        background: var(--background);
        color: var(--text-primary);
      }

      header {
        background: var(--surface);
        padding: 20px;
        border-bottom: 1px solid var(--border);
      }

      .container {
        max-width: 1400px;
        margin: auto;
        padding: 0 20px;
      }

      .header-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      h1 {
        color: var(--primary);
      }

      main {
        padding: 30px 0;
      }

      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 14px;
        border-bottom: 1px solid var(--border);
        text-align: center;
      }

      th {
        background: var(--surface-light);
        font-size: 12px;
        text-transform: uppercase;
        color: var(--text-secondary);
      }

      tr:hover {
        background: rgba(255, 255, 255, 0.05);
      }

      .table-container {
        background: var(--surface);
        border-radius: var(--radius);
        overflow: hidden;
        margin-bottom: 40px;
      }

      .container-id {
        font-family: monospace;
        font-size: 12px;
        background: rgba(255, 255, 255, 0.08);
        padding: 4px 6px;
        border-radius: 4px;
      }

      .status-running {
        color: var(--success);
      }
      .status-exited {
        color: var(--danger);
      }

      .btn {
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-primary);
        cursor: pointer;
        margin-right: 6px;
      }

      .btn:hover {
        background: var(--surface-light);
      }
      .btn-success {
        border-color: var(--success);
        color: var(--success);
      }
      .btn-warning {
        border-color: var(--warning);
        color: var(--warning);
      }
      .btn-danger {
        border-color: var(--danger);
        color: var(--danger);
      }

      .logs-box {
        background: #020617;
        color: #94a3b8;
        padding: 16px;
        font-family: monospace;
        max-height: 400px;
        overflow-y: auto;
        border-radius: 0 0 12px 12px;
        white-space: pre-wrap;
      }

      footer {
        text-align: center;
        padding: 20px;
        border-top: 1px solid var(--border);
        color: var(--text-secondary);
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(2, 6, 23, 0.8);
        z-index: 999;
      }

      .modal {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: var(--surface);
        border-radius: 12px;
        padding: 24px;
        width: 380px;
        z-index: 1000;
        border: 1px solid var(--border);
      }

      .modal h3 {
        color: var(--primary);
        margin-bottom: 10px;
      }
      .modal p {
        color: var(--text-secondary);
        margin-bottom: 20px;
      }

      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>

  <body>
    <header>
      <div class="container header-content">
        <h1><i class="fas fa-ship"></i> Docker Manager</h1>
        <button class="btn" onclick="loadAll()">Reload</button>
      </div>
    </header>

    <main class="container">
      <section>
        <div class="section-header">
          <h2><i class="fas fa-box"></i> Containers</h2>
        </div>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Image</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="containerTable"></tbody>
          </table>
        </div>
      </section>

      <section>
        <div class="section-header">
          <h2><i class="fas fa-layer-group"></i> Images</h2>
          <button
            class="btn btn-danger"
            onclick="confirmAction('Remove ALL images?', removeAllImages)"
          >
            <i class="fas fa-trash-sweep"></i> Remove All
          </button>
        </div>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Created</th>
                <th>Tag</th>
                <th>ID</th>
                <th>Size</th>
                <th>Containers</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="imageTable"></tbody>
          </table>
        </div>
      </section>

      <section>
        <div class="section-header">
          <h2><i class="fas fa-terminal"></i> Logs</h2>
          <div>
            <span id="logTitle">No container selected</span>
            <button class="btn btn-danger" onclick="resetLogs()">
              Reset Logs
            </button>
          </div>
        </div>
        <div class="logs-box" id="logsBox">Select a container to view logs</div>
      </section>
    </main>

    <footer>Docker Manager © 2024</footer>

    <div id="modalRoot" class="hidden">
      <div class="modal-backdrop"></div>
      <div class="modal">
        <h3 id="modalTitle"></h3>
        <p id="modalMessage"></p>
        <div class="modal-actions">
          <button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn btn-danger" id="modalConfirm">Confirm</button>
        </div>
      </div>
    </div>

    <script>
      const APIS = ["http://0.0.0.0:5000", "http://10.2.1.235:5000"];

      let activeAPI = null;
      let refreshIntervalId = null;
      let currentLogContainerId = null;
      let currentLogContainerName = null;
      let modalAction = null;
      let currentImages = []; // Store image data for batch actions

      async function fetchWithFallback(path, options = {}, timeout = 4000) {
        const servers = activeAPI
          ? [activeAPI, ...APIS.filter((a) => a !== activeAPI)]
          : APIS;

        for (const baseUrl of servers) {
          try {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeout);

            const res = await fetch(`${baseUrl}${path}`, {
              ...options,
              signal: controller.signal,
            });

            clearTimeout(timer);

            if (!res.ok) throw new Error(res.status);
            activeAPI = baseUrl;
            return await res.json();
          } catch (e) {
            console.warn("API failed:", baseUrl);
          }
        }
        throw new Error("All APIs unreachable");
      }

      function openModal(title, msg, action) {
        modalAction = action;
        modalTitle.textContent = title;
        modalMessage.textContent = msg;
        modalRoot.classList.remove("hidden");
      }

      function closeModal() {
        modalAction = null;
        modalRoot.classList.add("hidden");
      }

      modalConfirm.onclick = () => {
        if (modalAction) modalAction();
        closeModal();
      };

      async function loadContainers() {
        const data = await fetchWithFallback("/get/all/containers");
        containerTable.innerHTML = "";

        data.forEach((c) => {
          const running = c.status.includes("Up");
          containerTable.innerHTML += `
      <tr>
        <td><span class="container-id">${c.container_id.slice(
          0,
          12
        )}</span></td>
        <td>${c.name}</td>
        <td>${c.image}</td>
        <td class="${running ? "status-running" : "status-exited"}">${
            c.status
          }</td>
        <td>
          <button class="btn" onclick="loadLogs('${c.container_id}','${
            c.name
          }')">Logs</button>
          ${
            running
              ? `<button class="btn btn-success" onclick="confirmAction('Restart?',()=>restartContainer('${c.container_id}'))">Restart</button>
               <button class="btn btn-warning" onclick="confirmAction('Stop?',()=>stopContainer('${c.container_id}'))">Stop</button>`
              : `<button class="btn btn-warning" onclick="confirmAction('Start?',()=>startContainer('${c.container_id}'))">Start</button>`
          }
          <button class="btn btn-danger" onclick="confirmAction('Remove?',()=>removeContainer('${
            c.container_id
          }'))">Remove</button>
        </td>
      </tr>`;
        });
      }

      async function loadImages() {
        const data = await fetchWithFallback("/get/all/images");
        currentImages = data; // Save for batch actions
        imageTable.innerHTML = data
          .map(
            (i) => `
    <tr>
      <td>${i.Created_Since}</td>
      <td>${i.Tag || "<none>"}</td>
      <td><span class="container-id">${i.ID.slice(7, 19)}</span></td>
      <td>${i.Size}</td>
      <td>${i.Containers}</td>
      <td>
        <button class="btn btn-danger" onclick="confirmAction('Remove Image?', () => removeImage('${
          i.ID
        }'))">
            <i class="fas fa-trash"></i>
        </button>
      </td>
    </tr>
  `
          )
          .join("");
      }

      // --- New Image Management Methods ---

      async function removeImage(imageId) {
        await fetchWithFallback("/remove/image", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ imageId: imageId }),
        });
        loadImages();
      }

      async function removeAllImages() {
        const ids = currentImages.map((i) => i.ID);
        if (ids.length === 0) return;

        await fetchWithFallback("/remove/images", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ imageIds: ids }),
        });
        loadImages();
      }

      // ------------------------------------

      async function loadLogs(id, name) {
        currentLogContainerId = id;
        currentLogContainerName = name;
        logTitle.textContent = name;

        const data = await fetchWithFallback("/logs/container", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            containerId: id,
            tail: 200,
            timestamps: true,
          }),
        });

        logsBox.textContent = data.logs || "No logs";
      }

      async function refreshLogsIfNeeded() {
        if (!currentLogContainerId) return;
        loadLogs(currentLogContainerId, currentLogContainerName);
      }

      function confirmAction(msg, fn) {
        openModal("Confirm Action", msg, fn);
      }

      async function startContainer(id) {
        await fetchWithFallback("/start/container", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ containerId: id }),
        });
        loadContainers();
      }

      async function stopContainer(id) {
        await fetchWithFallback("/stop/container", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ containerId: id }),
        });
        loadContainers();
      }

      async function restartContainer(id) {
        await fetchWithFallback("/restart/container", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ containerId: id }),
        });
        loadContainers();
      }

      async function removeContainer(id) {
        await fetchWithFallback("/remove/container", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ containerId: id }),
        });
        loadContainers();
      }

      function resetLogs() {
        currentLogContainerId = null;
        currentLogContainerName = null;
        logTitle.textContent = "No container selected";
        logsBox.textContent = "Logs cleared.";
      }

      function loadAll() {
        loadContainers();
        loadImages();
      }

      function startAutoRefresh() {
        if (refreshIntervalId) return;
        refreshIntervalId = setInterval(() => {
          loadAll();
          refreshLogsIfNeeded();
        }, 30000);
      }

      document.addEventListener("DOMContentLoaded", () => {
        loadAll();
        startAutoRefresh();
      });
    </script>
  </body>
</html>
