<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Docker Manager | Dashboard</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      :root {
        --primary: #00b4d8;
        --primary-dark: #0096c7;
        --secondary: #1e293b;
        --background: #0f172a;
        --surface: #1e293b;
        --surface-light: #334155;
        --text-primary: #f8fafc;
        --text-secondary: #cbd5e1;
        --success: #10b981;
        --warning: #f59e0b;
        --danger: #ef4444;
        --border: #475569;
        --radius: 12px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Inter, system-ui, sans-serif;
        background: var(--background);
        color: var(--text-primary);
      }

      header {
        background: var(--surface);
        padding: 20px;
        border-bottom: 1px solid var(--border);
      }

      .container {
        max-width: 1400px;
        margin: auto;
        padding: 0 20px;
      }

      .header-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      h1 {
        color: var(--primary);
      }

      main {
        padding: 30px 0;
      }

      .section-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 20px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 14px;
        border-bottom: 1px solid var(--border);
      }

      th {
        background: var(--surface-light);
        font-size: 12px;
        text-transform: uppercase;
        color: var(--text-secondary);
      }

      tr:hover {
        background: rgba(255, 255, 255, 0.05);
      }

      .table-container {
        background: var(--surface);
        border-radius: var(--radius);
        overflow: hidden;
        margin-bottom: 40px;
      }

      .container-id {
        font-family: monospace;
        font-size: 12px;
        background: rgba(255, 255, 255, 0.08);
        padding: 4px 6px;
        border-radius: 4px;
      }

      .status-running {
        color: var(--success);
      }

      .status-exited {
        color: var(--danger);
      }

      .btn {
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-primary);
        cursor: pointer;
        margin-right: 6px;
      }

      .btn:hover {
        background: var(--surface-light);
      }

      .btn-danger {
        border-color: var(--danger);
        color: var(--danger);
      }

      .btn-danger:hover {
        background: rgba(239, 68, 68, 0.15);
      }

      .logs-box {
        background: #020617;
        color: #94a3b8;
        padding: 16px;
        font-family: monospace;
        max-height: 400px;
        overflow-y: auto;
        border-radius: 0 0 12px 12px;
      }

      footer {
        text-align: center;
        padding: 20px;
        border-top: 1px solid var(--border);
        color: var(--text-secondary);
      }
    </style>
  </head>

  <body>
    <header style="margin-bottom: 1%;">
      <div class="container header-content">
        <h1><i class="fas fa-ship"></i> Docker Manager</h1>
        <button class="btn" onclick="loadAll()">Reload</button>
      </div>
    </header>

    <main class="container">
      <section>
        <div class="section-header">
          <h2><i class="fas fa-box"></i> Containers</h2>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Image</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="containerTable"></tbody>
          </table>
        </div>
      </section>

      <section>
        <div class="section-header">
          <h2><i class="fas fa-layer-group"></i> Images</h2>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Repository</th>
                <th>Tag</th>
                <th>ID</th>
                <th>Size</th>
                <th>Containers</th>
              </tr>
            </thead>
            <tbody id="imageTable"></tbody>
          </table>
        </div>
      </section>

      <section>
        <div class="section-header">
          <h2><i class="fas fa-terminal"></i> Logs</h2>
          <span id="logTitle">No container selected</span>
        </div>
        <div class="logs-box" id="logsBox">Select a container to view logs</div>
      </section>
    </main>

    <footer style="margin-top: 1%;">Docker Manager © 2024</footer>

    <script>
      const API = "http://0.0.0.0:5000";

      async function loadContainers() {
        const res = await fetch(`${API}/get/all/containers`);
        const data = await res.json();
        const table = document.getElementById("containerTable");
        table.innerHTML = "";

        data.forEach((c) => {
          const isRunning = c.status.includes("Up");

          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td><span class="container-id">${c.container_id.slice(0, 12)}</span></td>
            <td>${c.name}</td>
            <td>${c.image}</td>
            <td class="${isRunning ? "status-running" : "status-exited"}">
              ${c.status}
            </td>
            <td>
              <button class="btn" onclick="loadLogs('${c.container_id}','${c.name}')">Logs</button>

              ${
                isRunning
                  ? `
                    <button class="btn" onclick="restartContainer('${c.container_id}')">Restart</button>
                    <button class="btn" onclick="stopContainer('${c.container_id}')">Stop</button>
                  `
                  : `
                    <button class="btn" onclick="startContainer('${c.container_id}')">Start</button>
                  `
              }

              <button class="btn btn-danger" onclick="removeContainer('${c.container_id}')">Remove</button>
            </td>
          `;
          table.appendChild(tr);
        });
      }

      async function loadImages() {
        const res = await fetch(`${API}/get/all/images`);
        const data = await res.json();
        const table = document.getElementById("imageTable");
        table.innerHTML = "";

        data.forEach((i) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${i.Tag || "<none>"}</td>
            <td>${i.Tag || "<none>"}</td>
            <td><span class="container-id">${i.ID.slice(7, 19)}</span></td>
            <td>${i.Size}</td>
            <td>${i.Containers}</td>
          `;
          table.appendChild(tr);
        });
      }

      async function loadLogs(id, name) {
        document.getElementById("logTitle").textContent = name;

        const res = await fetch(`${API}/logs/container`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ containerId: id, tail: 200, timestamps: true }),
        });

        const data = await res.json();
        document.getElementById("logsBox").textContent = data.logs || "No logs available";
      }

      async function startContainer(id) {
        if (!confirm("Start this container?")) return;

        await fetch(`${API}/start/container`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ containerId: id }),
        });

        loadContainers();
      }

      async function stopContainer(id) {
        if (!confirm("Stop this container?")) return;

        await fetch(`${API}/stop/container`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ containerId: id }),
        });

        loadContainers();
      }

      async function restartContainer(id) {
        if (!confirm("Restart this container?")) return;

        await fetch(`${API}/restart/container`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ containerId: id }),
        });

        loadContainers();
      }

      async function removeContainer(id) {
        if (!confirm("Remove this container? This cannot be undone.")) return;

        await fetch(`${API}/remove/container`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ containerId: id }),
        });

        loadContainers();
      }

      function loadAll() {
        loadContainers();
        loadImages();
      }

      document.addEventListener("DOMContentLoaded", loadAll);
    </script>
  </body>
</html>
